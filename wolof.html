<!DOCTYPE html>
<html lang="wo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jàngale Wolof - Application bu Bees</title>
    <style>
        /* DESIGN BU BEES BU RAFET TE YOMB A LIRE */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Ekránu Téléphone bi */
        .phone-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: #ffffff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 20px;
        }

        /* Kaw application bi (Header) */
        .header {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Biir paj bi (Mën na dox ca suuf) */
        .main-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .instruction-text {
            text-align: center;
            color: #64748b;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: 500;
        }

        /* Cax yu bees yi (Lesson Cards) - Da fa rëy ngir mu yomb a bës */
        .lesson-card {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Li day wone ne bës nga ko */
        .lesson-card:hover, .lesson-card:active {
            border-color: #0284c7;
            background-color: #f0f9ff;
            transform: scale(0.98);
        }

        .text-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .wolof-word {
            font-size: 28px;
            font-weight: 800;
            color: #1e293b;
        }

        .meaning-word {
            font-size: 15px;
            color: #64748b;
            font-style: italic;
        }

        /* Butoŋu Audio bu rëy bi (Speaker) */
        .speaker-icon {
            background-color: #e0f2fe;
            color: #0284c7;
            width: 55px;
            height: 55px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: background-color 0.2s;
        }

        .lesson-card:active .speaker-icon {
            background-color: #0284c7;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- Header -->
    <div class="header">
        🇸🇳 JÀNGALE WOLOF
    </div>

    <!-- Biir Paj bi -->
    <div class="main-content">
        <p class="instruction-text">Bësël kàddú bu nekk ngir dégg son bi:</p>

        <!-- Misal 1: Arafu Ŋ -->
        <div class="lesson-card" onclick="lexoWolof('Ŋam')">
            <div class="text-section">
                <span class="wolof-word">Ŋam</span>
                <span class="meaning-word">Jàngum Araf bi: Ŋ</span>
            </div>
            <div class="speaker-icon">🔊</div>
        </div>

        <!-- Misal 2: Arafu Ñ -->
        <div class="lesson-card" onclick="lexoWolof('Ñari')">
            <div class="text-section">
                <span class="wolof-word">Ñari</span>
                <span class="meaning-word">Jàngum Araf bi: Ñ</span>
            </div>
            <div class="speaker-icon">🔊</div>
        </div>

        <!-- Misal 3: Arafu Ë -->
        <div class="lesson-card" onclick="lexoWolof('Fëgg')">
            <div class="text-section">
                <span class="wolof-word">Fëgg</span>
                <span class="meaning-word">Jàngum Araf bi: Ë</span>
            </div>
            <div class="speaker-icon">🔊</div>
        </div>

        <!-- Misal 4: Nanga def -->
        <div class="lesson-card" onclick="lexoWolof('Nanga def')">
            <div class="text-section">
                <span class="wolof-word">Nanga def?</span>
                <span class="meaning-word">Nuyoowu Wolof</span>
            </div>
            <div class="speaker-icon">🔊</div>
        </div>

    </div>
</div>

<!-- SYSTEME AUDIO BI KÓY LIRAL TÉLÉPHONE BI -->
<script>
function lexoWolof(teksti) {
    if ('speechSynthesis' in window) {
        // Lii day tax mu arrêté audio bu jiitu woon ngir mu baña boole baatyi
        window.speechSynthesis.cancel();

        var utterance = new SpeechSynthesisUtterance(teksti);
        
        // Vitesse bi: 0.75 day tax mu yex lool ngir nit ki dégg ko bu baax
        utterance.rate = 0.75; 
        
        // Code làkku Wolof (wo-SN)
        utterance.lang = 'wo-SN'; 

        // Liral jëfandikoo-kat bi
        window.speechSynthesis.speak(utterance);
    } else {
        alert("Sa téléphone mënul doxal wàllu audio bi otomatikament.");
    }
}
</script>

</body>
</html>
