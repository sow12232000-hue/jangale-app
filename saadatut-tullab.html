<!DOCTYPE html>
<html lang="wo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jàngu Nahwu 1</title>
    <!-- Font Awesome ngir icône bitoo dellu gannaaw bi ak audio bi -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tëggu buntu kaw bi (bitoo dellu gannaaw ak tiitmar bi) */
        .top-bar {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
            position: relative;
        }

        .back-btn {
            background: #1c1c3a;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-decoration: none; /* Ngir bu doon link HTML */
        }

        .back-btn:active {
            background: #00ffcc;
            color: #1c1c3a;
        }

        .header-title {
            color: #1c1c3a;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            flex-grow: 1;
            text-align: center;
            margin-right: 40px; /* Ngir mu fete digg dëgg dëgg */
        }

        .header-subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Grid container bi yor kàrd yu bari yi */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .lecon-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #eef2f5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .mbind-arab {
            font-size: 22px;
            color: #1c1c3a;
            direction: rtl;
            margin: 5px 0;
            font-weight: bold;
        }

        .mbind-wolof {
            font-size: 14px;
            color: #555;
            margin: 5px 0 15px 0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        /* Bitoo audio yu rafet yu dëgër */
        .audio-btn {
            background: #1c1c3a;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            transition: 0.2s;
        }

        .audio-btn:active {
            background: #00ffcc;
            color: #1c1c3a;
        }
    </style>
</head>
<body>

    <!-- Buntu kaw: Bitoo dellu gannaaw ak Titre bi -->
    <div class="top-bar">
        <!-- Soo bëggé mu delloo la ci index.html walla beneen page, soppi link bi fi -->
        <a href="javascript:history.back()" class="back-btn">
            <i class="fas fa-arrow-left"></i>
        </a>
        <div class="header-title">jàngale</div>
    </div>
    
    <div class="header-subtitle">Darsu Nahwu - Xeeti baat yi</div>

    <div class="grid-container">

        <!-- Kàrd 1 -->
        <div class="lecon-card">
            <div>
                <p id="arab-1" class="mbind-arab">اَلِاسْمُ</p>
                <p id="wolof-1" class="mbind-wolof">Tur</p>
            </div>
            <div class="btn-group">
                <button class="audio-btn" onclick="liral('arab-1', 'ar')"><i class="fas fa-volume-up"></i> Ar</button>
                <button class="audio-btn" onclick="liral('wolof-1', 'wo')"><i class="fas fa-volume-up"></i> Wo</button>
            </div>
        </div>

        <!-- Kàrd 2 -->
        <div class="lecon-card">
            <div>
                <p id="arab-2" class="mbind-arab">اَلْفِعْلُ</p>
                <p id="wolof-2" class="mbind-wolof">Jëf</p>
            </div>
            <div class="btn-group">
                <button class="audio-btn" onclick="liral('arab-2', 'ar')"><i class="fas fa-volume-up"></i> Ar</button>
                <button class="audio-btn" onclick="liral('wolof-2', 'wo')"><i class="fas fa-volume-up"></i> Wo</button>
            </div>
        </div>

        <!-- Kàrd 3 -->
        <div class="lecon-card">
            <div>
                <p id="arab-3" class="mbind-arab">اَلْحَرْفُ</p>
                <p id="wolof-3" class="mbind-wolof">Harf</p>
            </div>
            <div class="btn-group">
                <button class="audio-btn" onclick="liral('arab-3', 'ar')"><i class="fas fa-volume-up"></i> Ar</button>
                <button class="audio-btn" onclick="liral('wolof-3', 'wo')"><i class="fas fa-volume-up"></i> Wo</button>
            </div>
        </div>

        <!-- Kàrd 4 -->
        <div class="lecon-card">
            <div>
                <p id="arab-4" class="mbind-arab">جَاءَ زَيْدٌ</p>
                <p id="wolof-4" class="mbind-wolof">Zayd ñëw na</p>
            </div>
            <div class="btn-group">
                <button class="audio-btn" onclick="liral('arab-4', 'ar')"><i class="fas fa-volume-up"></i> Ar</button>
                <button class="audio-btn" onclick="liral('wolof-4', 'wo')"><i class="fas fa-volume-up"></i> Wo</button>
            </div>
        </div>

    </div>

    <!-- CODE JAVASCRIPT BU WOOR TE GAW NGIR KÀDDU GI -->
    <script>
        function liral(elementId, lakk) {
            var synth = window.speechSynthesis || window.webkitSpeechSynthesis;
            if (!synth) return;

            let mbindMi = document.getElementById(elementId).innerText;
            synth.cancel(); // Dagg lu jëkk gi ci saasa

            let kaddoguTallah = new SpeechSynthesisUtterance();
            kaddoguTallah.rate = 0.70; // Yeexal kàddu gi ngir mu leer lool

            if (lakk === 'wo') {
                let textePhonetic = mbindMi.toLowerCase();
                textePhonetic = textePhonetic.replace(/jëf/g, "djëf");
                textePhonetic = textePhonetic.replace(/ñëw/g, "gniow");
                textePhonetic = textePhonetic.replace(/zayd/g, "zayed");
                
                kaddoguTallah.text = textePhonetic;
                kaddoguTallah.lang = 'fr-FR'; 
            } else {
                kaddoguTallah.text = mbindMi;
                kaddoguTallah.lang = 'ar-SA'; 
            }

            synth.speak(kaddoguTallah);
        }
    </script>

</body>
</html>
