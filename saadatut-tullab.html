<!DOCTYPE html>
<html lang="wo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jàngu Nahwu 1</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            color: #1c1c3a;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .header-subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* Tëggu grid bi ngir kàrd yu bari yi */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .lecon-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #eef2f5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .mbind-arab {
            font-size: 22px;
            color: #1c1c3a;
            direction: rtl;
            margin: 5px 0;
            font-weight: bold;
        }

        .mbind-wolof {
            font-size: 14px;
            color: #555;
            margin: 5px 0 15px 0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        /* Bitoo audio yu rafet te raye */
        .audio-btn {
            background: #f0f4f8;
            color: #1c1c3a;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: 0.2s;
        }

        .audio-btn:active {
            background: #1c1c3a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="header-title">jàngale</div>
    <div class="header-subtitle">Darsu Nahwu - Xeeti baat yi</div>

    <div class="grid-container">

        <!-- Kàrd 1 -->
        <div class="lecon-card">
            <div>
                <p id="arab-1" class="mbind-arab">اَلِاسْمُ</p>
                <p id="wolof-1" class="mbind-wolof">Tur</p>
            </div>
            <div class="btn-group">
                <button class="audio-btn" onclick="liral('arab-1', 'ar')">ع</button>
                <button class="audio-btn" onclick="liral('wolof-1', 'wo')">W</button>
            </div>
        </div>

        <!-- Kàrd 2 -->
        <div class="lecon-card">
            <div>
                <p id="arab-2" class="mbind-arab">اَلْفِعْلُ</p>
                <p id="wolof-2" class="mbind-wolof">Jëf</p>
            </div>
            <div class="btn-group">
                <button class="audio-btn" onclick="liral('arab-2', 'ar')">ع</button>
                <button class="audio-btn" onclick="liral('wolof-2', 'wo')">W</button>
            </div>
        </div>

        <!-- Kàrd 3 -->
        <div class="lecon-card">
            <div>
                <p id="arab-3" class="mbind-arab">اَلْحَرْفُ</p>
                <p id="wolof-3" class="mbind-wolof">Harf</p>
            </div>
            <div class="btn-group">
                <button class="audio-btn" onclick="liral('arab-3', 'ar')">ع</button>
                <button class="audio-btn" onclick="liral('wolof-3', 'wo')">W</button>
            </div>
        </div>

        <!-- Kàrd 4 -->
        <div class="lecon-card">
            <div>
                <p id="arab-4" class="mbind-arab">جَاءَ زَيْدٌ</p>
                <p id="wolof-4" class="mbind-wolof">Zayd ñëw na</p>
            </div>
            <div class="btn-group">
                <button class="audio-btn" onclick="liral('arab-4', 'ar')">ع</button>
                <button class="audio-btn" onclick="liral('wolof-4', 'wo')">W</button>
            </div>
        </div>

    </div>

    <!-- CODE JAVASCRIPT BU WOOR TE GAW -->
    <script>
        function liral(elementId, lakk) {
            // Jël kàddu gu tàllal gu biir phone bi (window walla webkit)
            var synth = window.speechSynthesis || window.webkitSpeechSynthesis;
            if (!synth) return;

            // Jël mbind mi nekk ci biir id bi nga cuuq
            let mbindMi = document.getElementById(elementId).innerText;
            
            // Dagg kàddu gu jëkk gi ci saasa ngir mu baña bloqué
            synth.cancel(); 

            let kaddoguTallah = new SpeechSynthesisUtterance();
            kaddoguTallah.rate = 0.70; // Yeexal ko ngir mu leer lool ci jàng mi

            if (lakk === 'wo') {
                // Soppi mbindu Wolof mi ci wàllu phonétique ngir kàddu gu Franse bi wax ko ni Wolof dëgg
                let textePhonetic = mbindMi.toLowerCase();
                textePhonetic = textePhonetic.replace(/jëf/g, "djëf");
                textePhonetic = textePhonetic.replace(/ñëw/g, "gniow");
                textePhonetic = textePhonetic.replace(/zayd/g, "zayed");
                
                kaddoguTallah.text = textePhonetic;
                kaddoguTallah.lang = 'fr-FR'; // Jëfandikoo kàddu gu Franse bu yeex bi
            } else {
                kaddoguTallah.text = mbindMi;
                kaddoguTallah.lang = 'ar-SA'; // Jëfandikoo kàddu gu Arab
            }

            // Wut lakk bi gëna dëppoo ci biir système phone bi
            if (synth.getVoices) {
                let voices = synth.getVoices();
                let langTarget = lakk === 'wo' ? 'fr' : 'ar';
                let voiceFound = voices.find(v => v.lang.startsWith(langTarget));
                if (voiceFound) {
                    kaddoguTallah.voice = voiceFound;
                }
            }

            // Mu liral ko tàllal
            synth.speak(kaddoguTallah);
        }

        // Weeral kàddu yi bu sàyt bi di tàllalu
        var synth = window.speechSynthesis || window.webkitSpeechSynthesis;
        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = synth.getVoices;
        }
    </script>

</body>
</html>
