<!DOCTYPE html>
<html lang="wo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leson 3 : Aqsaamul Kalâm</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-title {
            color: #1c1c3a;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
        }

        .header-subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
            text-align: center;
        }

        /* Tëggu grid bi ngir kàrd yi am 2 colonnes mel ni sa leson Franse ba */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .lecon-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            border: 1px solid #eef2f5;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .mbind-arab {
            font-size: 20px;
            color: #1c1c3a;
            direction: rtl;
            margin: 5px 0;
            font-weight: bold;
        }

        .mbind-wolof {
            font-size: 14px;
            color: #555;
            margin: 5px 0 15px 0;
        }

        /* Bitoo audio bu ndaw bu mel ni haut-parleur bi ci sa nataal bi */
        .audio-btn {
            background: #f0f4f8;
            color: #1c1c3a;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .audio-btn:active {
            background: #1c1c3a;
            color: white;
        }
    </style>
</head>
<body>

    <div class="header-title">jàngale</div>
    <div class="header-subtitle">Leson 3 : 3 Xeeti baat yi ci Nahwu</div>

    <!-- Grid container bi yor kàrd yu bari yi -->
    <div class="grid-container">

        <!-- Kàrd 1: Al-Ismu -->
        <div class="lecon-card">
            <div>
                <p id="arab-1" class="mbind-arab">اَلِاسْمُ</p>
                <p id="wolof-1" class="mbind-wolof">Tur (Mel ni: Zayd, Xaj, Garab)</p>
            </div>
            <button class="audio-btn" onclick="liral('arab-1', 'ar')">🔊</button>
        </div>

        <!-- Kàrd 2: Al-Fi'lu -->
        <div class="lecon-card">
            <div>
                <p id="arab-2" class="mbind-arab">اَلْفِعْلُ</p>
                <p id="wolof-2" class="mbind-wolof">Jëf (Mel ni: Bind, Lekk, Dem)</p>
            </div>
            <button class="audio-btn" onclick="liral('arab-2', 'ar')">🔊</button>
        </div>

        <!-- Kàrd 3: Al-Harfu -->
        <div class="lecon-card">
            <div>
                <p id="arab-3" class="mbind-arab">اَلْحَرْفُ</p>
                <p id="wolof-3" class="mbind-wolof">Baat bu amul solo loxxu (Mel ni: Ci, Ak)</p>
            </div>
            <button class="audio-btn" onclick="liral('arab-3', 'ar')">🔊</button>
        </div>

        <!-- Kàrd 4: Misal bu mboole -->
        <div class="lecon-card">
            <div>
                <p id="arab-4" class="mbind-arab">جَاءَ زَيْدٌ</p>
                <p id="wolof-4" class="mbind-wolof">Zayd ñëw na (Jëf + Tur)</p>
            </div>
            <button class="audio-btn" onclick="liral('arab-4', 'ar')">🔊</button>
        </div>

    </div>

    <!-- Code JavaScript TTS bi -->
    <script>
        function liral(elementId, lakk) {
            var synth = window.speechSynthesis || window.webkitSpeechSynthesis;
            if (!synth) return;

            let mbindMi = document.getElementById(elementId).innerText;
            synth.cancel(); // Dagg lu jëkk gi ci saasa

            let kaddoguTallah = new SpeechSynthesisUtterance(mbindMi);
            kaddoguTallah.lang = lakk;
            kaddoguTallah.rate = 0.75; // Yeexal kàddu gi ngir mu leer ci Nahwu

            if (synth.getVoices) {
                let voices = synth.getVoices();
                let voiceFound = voices.find(v => v.lang.startsWith(lakk));
                if (voiceFound) {
                    kaddoguTallah.voice = voiceFound;
                }
            }

            // Dindi alert "interrupted" bi ngir mu baña gen ci screen bi
            kaddoguTallah.onerror = function(event) {
                if (event.error !== 'interrupted') {
                    console.log("Erreur TTS: " + event.error);
                }
            };

            synth.speak(kaddoguTallah);
        }

        var synth = window.speechSynthesis || window.webkitSynthesis;
        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = synth.getVoices;
        }
    </script>

</body>
</html>
